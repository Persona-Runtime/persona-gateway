[project]
name = "persona-minimal-api"
version = "0.1.0"
description = "Minimal Persona Runtime API: identity and persona creation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pgvector>=0.3,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "testcontainers[postgres]>=4.9,<5",
]

[tool.pytest.ini_options]
addopts = "-ra"
markers = ["integration: requires an isolated PostgreSQL instance"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
